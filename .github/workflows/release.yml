name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Package Standard and Docker separately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git archive --format=zip \
            --output="artifacts/cpp_Standard-${RELEASE_TAG}.zip" \
            "${RELEASE_TAG}" cpp_Standard/
          git archive --format=zip \
            --output="artifacts/cpp_docker-${RELEASE_TAG}.zip" \
            "${RELEASE_TAG}" cpp_docker/
          test "$(find artifacts -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/*.zip --clobber
          else
            gh release create "${RELEASE_TAG}" --verify-tag \
              --title "${RELEASE_TAG}" --generate-notes artifacts/*.zip
          fi
