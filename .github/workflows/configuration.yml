name: Configuration regression
on:
  push:
    paths:
      - 'cpp_docker/**'
      - 'cpp_Standard/**'
      - '.github/workflows/configuration.yml'
      - '.github/workflows/container-image.yml'
      - '.github/workflows/release.yml'
      - 'README.md'
      - 'doc/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repository and launcher regression tests
        run: python3 -m unittest discover -s cpp_docker/tests -v
      - name: C++ Standard configuration tests against actual headers
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Icpp_Standard -Icpp_Standard/include -Icpp_Standard/config \
            cpp_Standard/src/RuntimeConfig.cpp \
            cpp_Standard/tests/RuntimeConfigTest.cpp \
            -o /tmp/fq-config-standard
          /tmp/fq-config-standard cpp_Standard/pipeline.example.ini
