# Fourier_Quad configuration: compiled defaults < this INI.

# Paths: uncomment and set the locations used by this run.
# Commented entries retain compiled defaults; native runs use host paths.

[process]
# Existing exposure-list file for downstream-only runs; empty derives from output_root.
# expo_list =
# Rearranged catalog directory; relative to rearr_output_base_directory or the dataset root.
# rearr_output_directory =
# Rearranged output base; empty uses the dataset root.
# rearr_output_base_directory =
# Rearranged exposure-list filename, not a directory.
# rearranged_expo_list_filename =
# Rearranged list directory; empty uses the input-list parent.
# rearranged_expo_list_directory =
# FD exposure-list file; empty uses the rearranged list.
# fd_expo_list =
# FD output directory name or absolute directory.
# fd_output_directory =
# FD output base; empty uses the dataset root.
# fd_output_base_directory =

[astrocat]
# Flat directory of raw Gaia catalogs beginning with RA/Dec columns.
# input_directory =
# Published Gaia tiles; usually share one mount with lensing.astrometry_cat.
# output_directory =

[extcat]
# Raw external source-catalog directory.
# input_directory =
# Published external source-catalog tiles.
# output_directory =

[init]
# Raw Science FITS/FZ archive root.
# science_root =
# Raw DQ FITS/FZ archive root.
# dq_root =
# Dataset output root; science, dqmask, stamps, result, astrometry and expolists share this mount.
# output_root =

[lensing]
# Gaia tile directory read by the main phase.
