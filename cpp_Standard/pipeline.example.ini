# Scientific settings: uncomment and fill only the values to override.
# Commented entries retain config/*.hpp defaults. An active empty value does NOT inherit.
# No phases are selected here. Compiled defaults may enable the full pipeline.

[process]
# Repartition raw Gaia catalogs into one-degree tiles. [true / false]
# run_process_astrocat =
# Repartition raw external source catalogs. [true / false]
# run_process_extcat =
# Extract Science/DQ archives and publish datasets and exposure lists. [true / false]
# run_process_init =
# Run the numerical measurement phase. [true / false]
# run_process_main =
# Spatially rearrange the main-phase catalogs. [true / false]
# run_process_rearr =
# Run scientific field-distortion measurement; not a container diagnostic. [true / false]
# run_process_fd =

[astrocat]
# true: input starts with data; false: skip exactly one input header line. [true / false]
# add_header =
# Existing Gaia tile policy. [fail|overwrite]
# existing_policy =

[extcat]
# Comma-separated basename tokens (OR); empty selects all files. [comma-separated]
# filename_tokens =
# Search raw catalog subdirectories recursively. [true / false]
# recursive =
# Input column delimiter. [auto|whitespace|comma|tab]
# delimiter =
# Input header handling. [auto|present|absent]
# header_mode =
# Malformed-row policy. [fail|skip]
# malformed_policy =
# Existing external tile policy. [fail|overwrite]
# existing_policy =
# Positive MPI byte-range task size in MiB. [positive integer]
# chunk_mib =
# Positive external catalog width for pass-through mode. [positive integer]
# total_columns =
# Set true to use the ordered input_columns projection. [true / false]
# use_explicit_columns =
# Comma-separated one-based input column indices in output order. [e.g. 1,2,3]
# input_columns =
# Set true to use explicit RA/Dec positions rather than header discovery. [true / false]
# use_explicit_coordinate_columns =
# One-based RA column in the raw input. [positive integer]
# ra_column =
# One-based Dec column in the raw input. [positive integer]
# dec_column =
# One-based g-magnitude column; 0 marks the band absent. [non-negative integer]
# mag_g_column =
# One-based r-magnitude column; 0 marks the band absent. [non-negative integer]
# mag_r_column =
# One-based i-magnitude column; 0 marks the band absent. [non-negative integer]
# mag_i_column =
# One-based z-magnitude column; 0 marks the band absent. [non-negative integer]
# mag_z_column =
# One-based y-magnitude column; 0 marks the band absent. [non-negative integer]
# mag_y_column =
# One-based zp/photo-z column in the raw input; not a magnitude zero point. [positive integer]
# zp_column =

[init]
# Comma-separated TARGET:PREFIX pairs, e.g. gband:c4d_; replaces the old dataset/target/prefix options. [e.g. gband:c4d_]
# datasets =
# Comma-separated archive basename tokens (OR); an active empty value disables filtering. [comma-separated]
# contains =
# Existing dataset policy. [fail|resume|overwrite]
# existing =
# Maximum generated path length; 0 disables the guard. [non-negative integer]
# f77_max_path =

[lensing]
# Product of enabled stage primes. Factor 23 requires factor 19. [positive integer]
# process_stage =
# CCD partition: 1 for the whole CCD, 2 for amplifier halves.
# ccd_split =
# Galaxy-stamp smoothing selector; non-negative. [non-negative integer]
# gal_smooth =
# Star-stamp smoothing selector; non-negative. [non-negative integer]
# star_smooth =
# Pixel scale in arcsec/pixel; positive. [positive number]
# pixel_size =
# Positive CCD count. [positive integer]
# nmax_chip =
# Physical CCD width in pixels; positive. [positive integer]
# chipnx =
# Physical CCD height in pixels; positive. [positive integer]
# chipny =
# Astrometry: 0 for Gaia, 1 for identity mapping (Standard only).
# astrometry_trivial =
# Gaia layout: 1 for legacy large tiles, 2 for one-degree tiles (Standard runtime key).
# astrometry_cat_type =
# Super-flat correction: 0 off, 1 on (Standard only).
# include_flat =
# Mask mode: 0, 1, 2 or 3 (Standard only).
# include_mask =
# External sources: 0 off, 1 on; FD requires 1 (Standard only).
# ext_cat =
# PSF input: 0 for exposure stars, 1 for external PSF (Standard only).
# ext_psf =
# Deblending: 0 off, 1 on (Standard only).
# deblending =
# PSF model: 1 local polynomial, 2 hybrid (Standard only).
# psf_type =
